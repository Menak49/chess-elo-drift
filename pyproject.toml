[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-elo-drift"
version = "2.0.0"
description = "What playing strength does a chess rating buy on chess.com and Lichess, 2014-2026, and how do the 2026 pools convert?"
requires-python = ">=3.10"

# Dependencies and their versions live in requirements.txt, which carries the
# reason for each one. They are deliberately not repeated here: two lists of the
# same pins drift apart.

[project.scripts]
chess-elo-drift = "chess_elo_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
